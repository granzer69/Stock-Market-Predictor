name: Model retrain (walk-forward)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Walk-forward retrain (truncated history)
        env:
          YF_DISABLE_CURL_CFFI: "1"
          WF_AS_OF_DATE: "2024-06-01"
          WF_OUTPUT: backend/artifacts/ci_retrain_${{ github.run_id }}
        run: python backend/scripts/walk_forward_retrain.py --as-of "$WF_AS_OF_DATE" --output "$WF_OUTPUT"
      - name: Upload retrain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lstm-wf-retrain-${{ github.run_id }}
          path: backend/artifacts/ci_retrain_${{ github.run_id }}
          retention-days: 30
