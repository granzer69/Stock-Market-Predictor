name: pytest

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (no TensorFlow)
        run: |
          pip install fastapi uvicorn pandas numpy scikit-learn joblib pytest httpx python-multipart
      - name: Run tests
        run: pytest tests/ -q
